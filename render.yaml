services:
  - type: web
    name: aditya-and-tishu
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://aditya-and-tishu.onrender.com